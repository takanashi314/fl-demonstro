[project]
name = "fl-demonstro"
version = "0.1.0"
description = "Flask 製の Web アプリケーション"
readme = "README.md"
authors = [
    { name = "Takanashi", email = "tnbirds314@gmail.com" }
]
requires-python = "==3.15.*"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.3",
    "flask-limiter[redis]>=4.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-session>=0.8.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=27.0.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djlint>=1.54.0",
    "flask-debugtoolbar>=0.16.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]


[tool.ruff]
cache-dir = ".dev_cache/.ruff_cache"
indent-width = 4
line-length = 88
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "debug/**/*.py",
    "pyproject.toml",
]
extend-exclude = ["migrations"]
respect-gitignore = true
output-format = "grouped"
show-fixes = false

[tool.ruff.format]
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "N",
    "S",
    "PT",
    "PTH",
    "T20",
    "B904",
    "B905",
    "DTZ001",
    "DTZ005",
    "F403",
    "F405",
    "PLE0241",
    "PLE0302",
    "PLW1641",
    "PLW2901",
    "RUF006",
]
typing-extensions = false
explicit-preview-rules = true
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
cache_dir = ".dev_cache/.mypy_cache"
files = ["src", "tests"]
disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["flask_login.*", "flask_migrate.*", "flask_session.*", "flask_wtf.*", "wtforms.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".dev_cache/.pytest_cache"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
log_cli = false
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login",
]

[tool.djlint]
profile = "jinja"
ignore = "H030,H023"
indent = 4
max_attribute_length = 70
max_line_length = 90
preserve_leading_space = false
preserve_blank_lines = true
format_attribute_template_tags = true
files = ["src/fl_demonstro/templates"]
